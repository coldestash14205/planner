<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drag & Drop Planner</title>
<style>
/* ============ THEME VARIABLES ============ */
:root {
  --bg: #f4f7fc;
  --panel-bg: #ffffff;
  --text: #1e293b;
  --text-muted: #64748b;
  --text-faint: #94a3b8;
  --border: #e9eef3;
  --border-soft: #f1f5f9;
  --input-bg: #f8fafc;
  --input-border: #e2e8f0;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.05);
  --panel-shadow: 0 8px 20px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.02);
  --slot-bg: #f8fafc;
  --slot-border: #cbd5e1;
  --count-bg: #f1f5f9;
  --count-text: #475569;
}

body.dark {
  --bg: #0f172a;
  --panel-bg: #1e293b;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --text-faint: #64748b;
  --border: #334155;
  --border-soft: #334155;
  --input-bg: #0f172a;
  --input-border: #334155;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.3);
  --panel-shadow: 0 8px 20px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.04);
  --slot-bg: #0f172a;
  --slot-border: #334155;
  --count-bg: #334155;
  --count-text: #cbd5e1;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
  min-height: 100vh;
  transition: background 0.2s, color 0.2s;
}

.app { max-width: 1400px; margin: 0 auto; }

/* ============ TOP BAR ============ */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}

h1 {
  font-size: 1.8rem;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

h1 .range-pill {
  background: #3b82f6;
  color: white;
  font-size: 1rem;
  padding: 4px 12px;
  border-radius: 40px;
  font-weight: 400;
}

h2 {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text);
}

.theme-btn {
  background: var(--panel-bg);
  border: 1px solid var(--input-border);
  color: var(--text);
  font-size: 1.2rem;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, transform 0.05s;
  box-shadow: var(--panel-shadow);
}

.theme-btn:hover { background: var(--input-bg); }
.theme-btn:active { transform: scale(0.95); }

/* ============ INFO BAR (date/time/countdown) ============ */
.info-bar {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

@media (min-width: 700px) {
  .info-bar {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .info-bar .countdown-card { grid-column: span 2; }
}

.info-card {
  background: var(--panel-bg);
  border-radius: 18px;
  padding: 14px 18px;
  box-shadow: var(--panel-shadow);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: background 0.2s;
}

.info-label {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}

.info-value {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
}

.countdown-card {
  background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
  color: white;
}

.countdown-card .info-label { color: rgba(255,255,255,0.85); }
.countdown-card .info-value { color: white; }

.countdown-card.idle {
  background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
}

.countdown-card.soon {
  background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
  animation: glowPulse 2s ease-in-out infinite;
}

@keyframes glowPulse {
  0%, 100% { box-shadow: var(--panel-shadow); }
  50%      { box-shadow: 0 0 0 4px rgba(245,158,11,0.35); }
}

.countdown-sub {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.85);
  margin-top: 2px;
}

/* ============ SYNC STATUS ============ */
.sync-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: 40px;
  background: var(--count-bg);
  color: var(--text-muted);
  transition: all 0.2s;
}

.sync-status.connected  { background: #d1fae5; color: #065f46; }
.sync-status.connecting { background: #fef3c7; color: #92400e; }
.sync-status.error      { background: #fee2e2; color: #991b1b; }

body.dark .sync-status.connected  { background: #064e3b; color: #6ee7b7; }
body.dark .sync-status.connecting { background: #78350f; color: #fcd34d; }
body.dark .sync-status.error      { background: #7f1d1d; color: #fca5a5; }

.sync-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: currentColor;
  animation: pulse 1.8s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ============ ADD TASK FORM ============ */
.add-task-form {
  background: var(--panel-bg);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 22px;
  box-shadow: var(--panel-shadow);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  transition: background 0.2s;
}

.add-task-form input[type="text"],
.add-task-form input[type="time"],
.add-task-form select {
  font-family: inherit;
  font-size: 0.9rem;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.add-task-form input[type="text"]:focus,
.add-task-form input[type="time"]:focus,
.add-task-form select:focus {
  border-color: #3b82f6;
  background: var(--panel-bg);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}

.add-task-form input[type="text"] { flex: 1 1 220px; min-width: 0; }
.add-task-form input[type="time"] { flex: 0 0 130px; }
.add-task-form select { flex: 0 0 160px; cursor: pointer; }

.add-task-form button {
  flex: 0 0 auto;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 10px 22px;
  border-radius: 12px;
  border: none;
  background: #3b82f6;
  color: white;
  cursor: pointer;
  transition: background 0.15s, transform 0.05s;
}

.add-task-form button:hover:not(:disabled) { background: #2563eb; }
.add-task-form button:active:not(:disabled) { transform: scale(0.97); }
.add-task-form button:disabled {
  background: #cbd5e1;
  cursor: not-allowed;
}

@media (max-width: 600px) {
  .add-task-form input[type="text"],
  .add-task-form input[type="time"],
  .add-task-form select,
  .add-task-form button { flex: 1 1 100%; }
}

/* ============ STATUS BARS ============ */
.status-bars {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  margin-bottom: 22px;
  width: 100%;
}

@media (min-width: 700px) {
  .status-bars {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
}

.status-bar {
  background: var(--panel-bg);
  border-radius: 20px;
  padding: 14px;
  box-shadow: var(--panel-shadow);
  border-top: 5px solid #cbd5e1;
  display: flex;
  flex-direction: column;
  min-height: 170px;
  max-height: 260px;
  transition: background 0.2s;
}

.status-bar[data-status="todo"]     { border-top-color: #3b82f6; }
.status-bar[data-status="progress"] { border-top-color: #f59e0b; }
.status-bar[data-status="completed"]{ border-top-color: #10b981; }

.status-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 8px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--border-soft);
}

.status-dot {
  width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
}
.todo-dot      { background: #3b82f6; }
.progress-dot  { background: #f59e0b; }
.completed-dot { background: #10b981; }

.status-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text);
  flex: 1;
}

.status-count {
  background: var(--count-bg);
  color: var(--count-text);
  font-size: 0.75rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 40px;
  min-width: 26px;
  text-align: center;
}

.status-items {
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow-y: auto;
  flex: 1;
  min-height: 60px;
}

.status-items .task-card {
  padding: 8px 10px;
  font-size: 0.82rem;
  border-radius: 10px;
  cursor: grab;
}

.status-bar[data-status="completed"] .task-card span:first-child {
  text-decoration: line-through;
  color: var(--text-muted);
}

.status-bar.drag-over {
  box-shadow: 0 0 0 3px rgba(59,130,246,0.4);
}

.status-empty {
  color: var(--text-faint);
  font-style: italic;
  font-size: 0.78rem;
  text-align: center;
  padding: 12px 0;
}

/* ============ MAIN DASHBOARD ============ */
.dashboard {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

@media (min-width: 1024px) {
  .dashboard { flex-direction: row; align-items: flex-start; }
  .checklist-panel { flex: 0 0 280px; }
  .calendar-panel  { flex: 1; min-width: 0; }
}

.checklist-panel, .calendar-panel {
  background: var(--panel-bg);
  border-radius: 24px;
  padding: 20px 16px;
  box-shadow: var(--panel-shadow);
  transition: background 0.2s;
}

.checklist-panel {
  display: flex;
  flex-direction: column;
  max-height: 80vh;
}

.checklist-items {
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  min-height: 180px;
}

.calendar-panel {
  overflow-x: auto;
  overflow-y: auto;
  max-height: 85vh;
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  flex-wrap: wrap;
  gap: 8px;
}

.calendar-header h2 { margin-bottom: 0; }

.calendar-grid {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 560px;
}

.calendar-row { display: flex; gap: 8px; align-items: stretch; }

.time-label {
  width: 70px;
  flex-shrink: 0;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-muted);
  padding-top: 10px;
  text-align: right;
  padding-right: 10px;
}

.time-slot {
  flex: 1;
  background: var(--slot-bg);
  border-radius: 12px;
  padding: 10px 12px;
  min-height: 64px;
  border: 1px dashed var(--slot-border);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: flex-start;
  align-content: flex-start;
  transition: background 0.2s, border-color 0.2s;
}

.time-slot.drag-over {
  background: #eff6ff;
  border-color: #3b82f6;
  border-style: solid;
  box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
}

body.dark .time-slot.drag-over { background: #1e3a8a33; }

.time-slot .task-card {
  padding: 8px 12px;
  font-size: 0.85rem;
  box-shadow: none;
}

/* ============ TASK CARDS ============ */
.task-card {
  background: var(--panel-bg);
  border-left: 5px solid #3b82f6;
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: var(--card-shadow);
  cursor: grab;
  user-select: none;
  font-weight: 500;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  touch-action: none;
  word-break: break-word;
  position: relative;
  transition: background 0.2s, border-color 0.2s;
}

.task-card:active { cursor: grabbing; }
.task-card.dragging { opacity: 0.4; transform: scale(0.98); }

.task-card .task-text {
  flex: 1;
  min-width: 0;
}

/* Delete button — appears on hover, always visible on touch */
.task-delete {
  flex-shrink: 0;
  margin-left: 10px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-faint);
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  opacity: 0.5;
  transition: opacity 0.15s, background 0.15s, color 0.15s;
}

.task-card:hover .task-delete { opacity: 1; }
.task-delete:hover {
  background: #fee2e2;
  color: #dc2626;
}
body.dark .task-delete:hover {
  background: #7f1d1d;
  color: #fca5a5;
}

@media (hover: none) {
  .task-delete { opacity: 0.85; }
}

/* ============ CATEGORY COLOURS (no text labels) ============ */
.task-card[data-category="other"]     { border-left-color: #3b82f6; background: #f8faff; }
.task-card[data-category="work"]      { border-left-color: #6366f1; background: #f5f5ff; }
.task-card[data-category="personal"]  { border-left-color: #ec4899; background: #fff5f9; }
.task-card[data-category="health"]    { border-left-color: #10b981; background: #f4fdf8; }
.task-card[data-category="learning"]  { border-left-color: #f59e0b; background: #fffbf0; }
.task-card[data-category="errands"]   { border-left-color: #8b5cf6; background: #f9f7ff; }
.task-card[data-category="urgent"]    { border-left-color: #ef4444; background: #fff5f5; }

/* Dark mode — deeper tinted backgrounds so colours stay distinct */
body.dark .task-card[data-category="other"]    { background: #1e293b; }
body.dark .task-card[data-category="work"]     { background: #1e1b4b; }
body.dark .task-card[data-category="personal"] { background: #2d1b2e; }
body.dark .task-card[data-category="health"]   { background: #14281d; }
body.dark .task-card[data-category="learning"] { background: #2b1f0a; }
body.dark .task-card[data-category="errands"]  { background: #221b3a; }
body.dark .task-card[data-category="urgent"]   { background: #2d1212; }

/* ============ MISC ============ */
.empty-message {
  color: var(--text-faint);
  font-style: italic;
  font-size: 0.9rem;
  padding: 12px;
  text-align: center;
}

@media (max-width: 600px) {
  body { padding: 10px; }
  h1 { font-size: 1.4rem; }
  .checklist-panel, .calendar-panel { padding: 16px 12px; border-radius: 20px; }
  .calendar-grid { min-width: 480px; }
  .time-label { width: 56px; font-size: 0.7rem; padding-right: 6px; }
  .time-slot { padding: 8px; min-height: 56px; }
  .add-task-form { padding: 12px; }
  .info-value { font-size: 1.15rem; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ TOP BAR ============ -->
  <div class="top-bar">
    <h1>
      📋 Drag &amp; Drop Planner
      <span class="range-pill">7am – 7pm</span>
    </h1>
    <div style="display:flex; gap:10px; align-items:center;">
      <span class="sync-status connecting" id="syncStatus">
        <span class="sync-dot"></span>
        <span id="syncText">Connecting…</span>
      </span>
      <button class="theme-btn" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
    </div>
  </div>

  <!-- ============ INFO BAR ============ -->
  <div class="info-bar">
    <div class="info-card">
      <div class="info-label">Today</div>
      <div class="info-value" id="dateValue">—</div>
    </div>
    <div class="info-card">
      <div class="info-label">Current time</div>
      <div class="info-value" id="timeValue">—</div>
    </div>
    <div class="info-card countdown-card idle" id="countdownCard">
      <div class="info-label">Next activity</div>
      <div class="info-value" id="countdownValue">No upcoming tasks</div>
      <div class="countdown-sub" id="countdownSub">Add a timed task to see a countdown</div>
    </div>
  </div>

  <!-- ============ ADD TASK FORM ============ -->
  <form class="add-task-form" id="addTaskForm">
    <input type="text" id="taskText" placeholder="What needs to be done?" required maxlength="80" autocomplete="off">
    <input type="time" id="taskTime" aria-label="Optional time">
    <select id="taskCategory" aria-label="Category">
      <option value="other">🔵</option>
      <option value="work">🟣</option>
      <option value="personal">🩷</option>
      <option value="health">🟢</option>
      <option value="learning">🟡</option>
      <option value="errands">🟪</option>
      <option value="urgent">🔴</option>
    </select>
    <button type="submit" id="addButton" disabled>+ Add Task</button>
  </form>

  <!-- ============ STATUS BARS ============ -->
  <div class="status-bars">
    <div class="status-bar" data-status="todo">
      <div class="status-header">
        <span class="status-dot todo-dot"></span>
        <span class="status-title">To Do</span>
        <span class="status-count" id="todoCount">0</span>
      </div>
      <div class="status-items" id="todoItems"></div>
    </div>

    <div class="status-bar" data-status="progress">
      <div class="status-header">
        <span class="status-dot progress-dot"></span>
        <span class="status-title">In Progress</span>
        <span class="status-count" id="progressCount">0</span>
      </div>
      <div class="status-items" id="progressItems"></div>
    </div>

    <div class="status-bar" data-status="completed">
      <div class="status-header">
        <span class="status-dot completed-dot"></span>
        <span class="status-title">Completed</span>
        <span class="status-count" id="completedCount">0</span>
      </div>
      <div class="status-items" id="completedItems"></div>
    </div>
  </div>

  <!-- ============ DASHBOARD ============ -->
  <div class="dashboard">
    <div class="checklist-panel">
      <h2>✅ Checklist</h2>
      <div class="checklist-items" id="checklistItems"></div>
    </div>

    <div class="calendar-panel">
      <div class="calendar-header">
        <h2>📅 Calendar</h2>
        <span style="font-size:0.8rem; color:var(--text-muted);">drag tasks here</span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  const addTaskForm         = document.getElementById('addTaskForm');
  const addButton           = document.getElementById('addButton');
  const taskTextInput       = document.getElementById('taskText');

  const taskCategorySelect  = document.getElementById('taskCategory');
  const syncStatus          = document.getElementById('syncStatus');
  const syncText            = document.getElementById('syncText');
  const dateValue           = document.getElementById('dateValue');
  const timeValue           = document.getElementById('timeValue');

  function applyTheme(dark) {
    document.body.classList.toggle('dark', dark);
    themeToggle.textContent = dark ? '☀️' : '🌙';
    try { localStorage.setItem('planner-dark', dark ? '1' : '0'); } catch (e) {}
  }

  themeToggle.addEventListener('click', () => {
    applyTheme(!document.body.classList.contains('dark'));
  });

  (function initTheme() {
    let dark = false;
    try {
      const saved = localStorage.getItem('planner-dark');
      if (saved === '1') dark = true;
      else if (saved === '0') dark = false;
      else dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) {}
    applyTheme(dark);
  })();

  // ============================================================
  // LIVE CLOCK + COUNTDOWN
  // ============================================================
  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function updateClockAndCountdown() {
    const now = new Date();

    // Date
    const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    dateValue.textContent = now.toLocaleDateString(undefined, opts);

    // Time
    const h12 = now.getHours() % 12 || 12;
    const ampm = now.getHours() >= 12 ? 'pm' : 'am';
    timeValue.textContent = `${h12}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${ampm}`;

    // Find next timed task today
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    let nextTask = null;
    let nextMinutes = Infinity;

    getAllTasks().forEach(task => {
      if (!task.badge) return;
      // badge format: "9:30am", "9am", "11:00pm"
      const m = task.badge.match(/^(\d{1,2})(?::(\d{2}))?(am|pm)$/i);
      if (!m) return;
      let h = parseInt(m[1], 10);
      const mins = m[2] ? parseInt(m[2], 10) : 0;
      const p = m[3].toLowerCase();
      if (p === 'pm' && h !== 12) h += 12;
      if (p === 'am' && h === 12) h = 0;
      const taskMinutes = h * 60 + mins;
      if (taskMinutes >= nowMinutes && taskMinutes < nextMinutes) {
        nextMinutes = taskMinutes;
        nextTask = { task, minutes: taskMinutes };
      }
    });

    countdownCard.classList.remove('idle', 'soon');

    if (!nextTask) {
      countdownValue.textContent = 'No upcoming tasks';
      countdownSub.textContent = 'Add a timed task to see a countdown';
      countdownCard.classList.add('idle');
      return;
    }

    const diff = nextTask.minutes - nowMinutes;
    const hrs = Math.floor(diff / 60);
    const mins = diff % 60;

    let label;
    if (diff === 0)      label = 'Right now!';
    else if (hrs === 0)  label = `${mins} min`;
    else if (mins === 0) label = `${hrs} hr`;
    else                 label = `${hrs} hr ${mins} min`;

    countdownValue.textContent = label;
    countdownSub.textContent = `until "${nextTask.task.text}" at ${nextTask.task.badge}`;

    if (diff <= 15) countdownCard.classList.add('soon');
  }

  setInterval(updateClockAndCountdown, 1000);
  updateClockAndCountdown();

  // ============================================================
  // SYNC STATUS
  // ============================================================
  function setSyncStatus(state, message) {
    syncStatus.classList.remove('connected', 'connecting', 'error');
    syncStatus.classList.add(state);
    syncText.textContent = message;
  }

  // ============================================================
  // SERIALIZE / APPLY
  // ============================================================
  function serializeState() {
    return {
      checklistTasks: checklistTasks,
      calendarSlots: Object.fromEntries(
        Object.entries(calendarSlots).map(([h, arr]) => [String(h), arr])
      ),
      statusMap: statusMap,
      nextTaskId: nextTaskId
    };
  }

  function applyRemoteState(data) {
    if (!data) return;
    checklistTasks = data.checklistTasks || [];

    calendarSlots = {};
    HOURS.forEach(h => { calendarSlots[h] = []; });
    if (data.calendarSlots) {
      Object.entries(data.calendarSlots).forEach(([h, arr]) => {
        const hourNum = parseInt(h, 10);
        if (!isNaN(hourNum)) calendarSlots[hourNum] = arr || [];
      });
    }

    statusMap  = data.statusMap  || {};
    nextTaskId = data.nextTaskId || 1;
  }

  function scheduleWrite() {
    if (isRemoteUpdate) return;
    if (!boardRef) return;

    clearTimeout(writeTimer);
    writeTimer = setTimeout(async () => {
      try {
        await boardRef.set(serializeState());
        setSyncStatus('connected', 'Synced');
      } catch (err) {
        console.error('Write failed:', err);
        setSyncStatus('error', 'Sync error');
      }
    }, 150);
  }

  async function startSync() {
    if (!db || !auth) {
      setSyncStatus('error', 'Firebase not configured');
      return;
    }

    setSyncStatus('connecting', 'Connecting…');

    try {
      if (!auth.currentUser) {
        await auth.signInAnonymously();
      }

      boardRef = db.collection('boards').doc(BOARD_ID);

      const snap = await boardRef.get();
      if (!snap.exists) {
        await boardRef.set({
          checklistTasks: [],
          calendarSlots: {},
          statusMap: {},
          nextTaskId: 1
        });
      }

      boardRef.onSnapshot(
        (docSnap) => {
          const data = docSnap.data();
          if (!data) return;

          isRemoteUpdate = true;
          applyRemoteState(data);
          renderAll();
          isRemoteUpdate = false;

          setSyncStatus('connected', 'Synced');
        },
        (err) => {
          console.error('Snapshot error:', err);
          setSyncStatus('error', 'Disconnected');
        }
      );

      addButton.disabled = false;
    } catch (err) {
      console.error('Firebase start failed:', err);
      setSyncStatus('error', 'Setup error — check config');
    }
  }

  // ============================================================
  // HELPERS
  // ============================================================
  function getAllTasks() {
    const all = [...checklistTasks];
    HOURS.forEach(h => {
      (calendarSlots[h] || []).forEach(t => {
        if (!all.some(x => x.id === t.id)) all.push(t);
      });
    });
    return all;
  }

  function formatTime(value) {
    if (!value) return '';
    const [hh, mm] = value.split(':');
    const hour = parseInt(hh, 10);
    if (isNaN(hour)) return '';
    const ampm = hour >= 12 ? 'pm' : 'am';
    let h12 = hour % 12; if (h12 === 0) h12 = 12;
    return mm && mm !== '00' ? `${h12}:${mm}${ampm}` : `${h12}${ampm}`;
  }

  // ============================================================
  // ADD TASK
  // ============================================================
  addTaskForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = taskTextInput.value.trim();
    if (!text) return;

    const badge = formatTime(taskTimeInput.value);
    const category = taskCategorySelect.value || 'other';
    const id = 'task-' + (nextTaskId++);

    checklistTasks.push({ id, text, badge, category });
    statusMap[id] = 'todo';

    taskTextInput.value = '';
    taskTextInput.focus();

    renderAll();
    scheduleWrite();
    updateClockAndCountdown();
  });

  // ============================================================
  // DELETE TASK
  // ============================================================
  function deleteTask(taskId) {
    // Remove from checklist
    const ci = checklistTasks.findIndex(t => t.id === taskId);
    if (ci !== -1) checklistTasks.splice(ci, 1);

    // Remove from all calendar slots
    HOURS.forEach(h => {
      const arr = calendarSlots[h] || [];
      const i = arr.findIndex(t => t.id === taskId);
      if (i !== -1) arr.splice(i, 1);
    });

    // Remove from status map
    delete statusMap[taskId];

    renderAll();
    scheduleWrite();
    updateClockAndCountdown();
  }

  // ============================================================
  // RENDER — STATUS BARS
  // ============================================================
  function renderStatusBars() {
    const all = getAllTasks();
    const grouped = { todo: [], progress: [], completed: [] };
    all.forEach(task => {
      let s = statusMap[task.id];
      if (s !== 'todo' && s !== 'progress' && s !== 'completed') {
        s = 'todo';
        statusMap[task.id] = 'todo';
      }
      grouped[s].push(task);
    });

    todoCount.textContent      = grouped.todo.length;
    progressCount.textContent  = grouped.progress.length;
    completedCount.textContent = grouped.completed.length;

    renderStatusList(todoItems, grouped.todo, 'todo');
    renderStatusList(progressItems, grouped.progress, 'progress');
    renderStatusList(completedItems, grouped.completed, 'completed');
  }

  function renderStatusList(container, tasks, status) {
    container.innerHTML = '';
    if (tasks.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'status-empty';
      empty.textContent = status === 'todo'    ? 'No tasks'
                       : status === 'progress' ? 'Nothing in progress'
                       : 'No completed tasks';
      container.appendChild(empty);
      return;
    }
    tasks.forEach(task => {
      const card = createTaskCard(task, 'status', status);
      card.dataset.status = status;
      container.appendChild(card);
    });
  }

  // ============================================================
  // RENDER — CHECKLIST
  // ============================================================
  function renderChecklist() {
    if (checklistTasks.length === 0) {
      checklistContainer.innerHTML =
        '<div class="empty-message">Add a task above to get started ✨</div>';
      return;
    }
    checklistContainer.innerHTML = '';
    checklistTasks.forEach(task => {
      checklistContainer.appendChild(createTaskCard(task, 'checklist'));
    });
  }

  // ============================================================
  // RENDER — CALENDAR
  // ============================================================
  function renderCalendar() {
    calendarGrid.innerHTML = '';
    HOURS.forEach(hour => {
      const row = document.createElement('div');
      row.className = 'calendar-row';

      const label = document.createElement('div');
      label.className = 'time-label';
      const ampm = hour >= 12 ? 'pm' : 'am';
      let dh = hour % 12; dh = dh === 0 ? 12 : dh;
      label.textContent = dh + ampm;

      const slot = document.createElement('div');
      slot.className = 'time-slot';
      slot.dataset.hour = hour;

      (calendarSlots[hour] || []).forEach(task => {
        const card = createTaskCard(task, 'calendar');
        card.dataset.hour = hour;
        slot.appendChild(card);
      });

      attachSlotDropListeners(slot);
      row.appendChild(label);
      row.appendChild(slot);
      calendarGrid.appendChild(row);
    });
  }

  // ============================================================
  // CREATE TASK CARD
  // ============================================================
  function createTaskCard(task, location, statusOverride) {
    const card = document.createElement('div');
    card.className = 'task-card';
    card.draggable = true;
    card.dataset.taskId   = task.id;
    card.dataset.location = location;
    card.dataset.category = task.category || 'other';
    if (statusOverride) card.dataset.status = statusOverride;

    const textSpan = document.createElement('span');
    textSpan.className = 'task-text';
    textSpan.textContent = task.text + (task.badge ? ` · ${task.badge}` : '');
    card.appendChild(textSpan);

    // Delete button
    const del = document.createElement('button');
    del.className = 'task-delete';
    del.type = 'button';
    del.title = 'Delete task';
    del.setAttribute('aria-label', 'Delete task');
    del.textContent = '×';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm(`Delete "${task.text}"?`)) {
        deleteTask(task.id);
      }
    });
    del.addEventListener('mousedown', (e) => e.stopPropagation());
    del.addEventListener('touchstart', (e) => e.stopPropagation());
    card.appendChild(del);

    const cat = task.category || 'other';
    card.title = `${task.text}${task.badge ? ' • ' + task.badge : ''} • ${cat}`;

    card.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', task.id);
      e.dataTransfer.effectAllowed = 'move';
      const loc = card.dataset.location;
      e.dataTransfer.setData('source-location', loc);
      if (loc === 'calendar') e.dataTransfer.setData('source-hour',   card.dataset.hour);
      if (loc === 'status')   e.dataTransfer.setData('source-status', card.dataset.status);
      card.classList.add('dragging');
    });

    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    });

    return card;
  }

  // ============================================================
  // REMOVE FROM SOURCE
  // ============================================================
  function removeFromSource(taskId, loc, hour, status) {
    let taskObj = null;

    if (loc === 'checklist') {
      const i = checklistTasks.findIndex(t => t.id === taskId);
      if (i !== -1) { taskObj = checklistTasks[i]; checklistTasks.splice(i, 1); }
    } else if (loc === 'calendar' && hour !== undefined && hour !== '') {
      const h = parseInt(hour, 10);
      const arr = calendarSlots[h] || [];
      const i = arr.findIndex(t => t.id === taskId);
      if (i !== -1) { taskObj = arr[i]; arr.splice(i, 1); }
    } else if (loc === 'status') {
      taskObj = getAllTasks().find(t => t.id === taskId) || null;
    }

    return taskObj;
  }

  // ============================================================
  // DROP — CALENDAR SLOT
  // ============================================================
  function attachSlotDropListeners(slot) {
    slot.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      slot.classList.add('drag-over');
    });
    slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
    slot.addEventListener('drop', (e) => {
      e.preventDefault();
      slot.classList.remove('drag-over');

      const taskId  = e.dataTransfer.getData('text/plain');
      const srcLoc  = e.dataTransfer.getData('source-location');
      const srcHour = e.dataTransfer.getData('source-hour');
      const srcStat = e.dataTransfer.getData('source-status');
      if (!taskId) return;

      const targetHour = parseInt(slot.dataset.hour, 10);
      if (isNaN(targetHour)) return;

      const taskObj = removeFromSource(taskId, srcLoc, srcHour, srcStat);
      if (taskObj) {
        if (!calendarSlots[targetHour]) calendarSlots[targetHour] = [];
        if (!calendarSlots[targetHour].some(t => t.id === taskObj.id)) {
          calendarSlots[targetHour].push({ ...taskObj });
        }
        statusMap[taskObj.id] = 'progress';
      }

      renderAll();
      scheduleWrite();
      updateClockAndCountdown();
    });
  }

  // ============================================================
  // DROP — CHECKLIST
  // ============================================================
  function attachChecklistDropListeners() {
    checklistContainer.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });

    checklistContainer.addEventListener('drop', (e) => {
      e.preventDefault();

      const taskId  = e.dataTransfer.getData('text/plain');
      const srcLoc  = e.dataTransfer.getData('source-location');
      const srcHour = e.dataTransfer.getData('source-hour');
      const srcStat = e.dataTransfer.getData('source-status');
      if (!taskId) return;
      if (srcLoc === 'checklist') return;

      const taskObj = removeFromSource(taskId, srcLoc, srcHour, srcStat);
      if (taskObj) {
        if (!checklistTasks.some(t => t.id === taskObj.id)) {
          checklistTasks.push({ ...taskObj });
        }
        statusMap[taskObj.id] = 'todo';
      }

      renderAll();
      scheduleWrite();
      updateClockAndCountdown();
    });
  }

  // ============================================================
  // DROP — STATUS BAR
  // ============================================================
  function attachStatusDropListeners() {
    document.querySelectorAll('.status-bar').forEach(bar => {
      bar.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        bar.classList.add('drag-over');
      });
      bar.addEventListener('dragleave', () => bar.classList.remove('drag-over'));

      bar.addEventListener('drop', (e) => {
        e.preventDefault();
        bar.classList.remove('drag-over');

        const taskId  = e.dataTransfer.getData('text/plain');
        const srcLoc  = e.dataTransfer.getData('source-location');
        const srcHour = e.dataTransfer.getData('source-hour');
        const srcStat = e.dataTransfer.getData('source-status');
        if (!taskId) return;

        const newStatus = bar.dataset.status;
        if (!newStatus) return;

        if (srcLoc === 'status') {
          statusMap[taskId] = newStatus;
          renderAll();
          scheduleWrite();
          return;
        }

        const taskObj = removeFromSource(taskId, srcLoc, srcHour, srcStat);
        if (taskObj) {
          if (!checklistTasks.some(t => t.id === taskObj.id)) {
            checklistTasks.push({ ...taskObj });
          }
          statusMap[taskObj.id] = newStatus;
        }

        renderAll();
        scheduleWrite();
        updateClockAndCountdown();
      });
    });
  }

  // ============================================================
  // RENDER ALL
  // ============================================================
  function renderAll() {
    renderChecklist();
    renderCalendar();
    renderStatusBars();
  }

  // ============================================================
  // INIT
  // ============================================================
  function init() {
    HOURS.forEach(h => { calendarSlots[h] = []; });
    renderAll();
    attachChecklistDropListeners();
    attachStatusDropListeners();
    startSync();
  }

  init();
})();
</script>
</body>
